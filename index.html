<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'TY Sxemasi va Real-Time Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .station-label {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #3b82f6;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .train-icon {
            font-size: 16px;
            text-align: center;
            line-height: 24px;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen">

    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
            <span>🚉</span> "O'ZBEKISTON TEMIR YO'LLARI" AJ YO'LLARI SXEMASI
        </h1>
        <div class="flex gap-4 text-xs">
            <span class="flex items-center gap-1"><span class="w-3 h-3 bg-green-500 rounded-full inline-block"></span> Afrosiyob</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-500 rounded-full inline-block"></span> Yo'lovchi</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 bg-amber-500 rounded-full inline-block"></span> Yuk Poyezdi</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 bg-red-500 rounded-full inline-block"></span> FVV Avariya</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <div id="map" class="flex-1 bg-gray-950"></div>
        <div class="w-80 bg-gray-800 border-l border-gray-700 p-4 overflow-y-auto">
            <h2 class="text-sm font-bold text-gray-300 uppercase mb-3">Aktiv Poyezdlar</h2>
            <div id="train-list" class="space-y-2"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([41.0000, 64.0000], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        const markers = {};

        // Stansiyalar va liniyalarni yuklash
        fetch('/api/map-data')
            .then(res => res.json())
            .then(data => {
                // Temir yo'l chiziqlarini chizish
                Object.values(data.routes).forEach(route => {
                    L.polyline(route, { color: '#2563eb', weight: 4, opacity: 0.8 }).addTo(map);
                });

                // Stansiya nomlarini xaritada ko'rsatish
                data.stations.forEach(st => {
                    L.circleMarker([st.lat, st.lng], { radius: 5, color: '#ffffff', fillColor: '#000000', fillOpacity: 1 }).addTo(map);
                    L.marker([st.lat, st.lng], {
                        icon: L.divIcon({
                            className: 'station-label',
                            html: st.name,
                            iconSize: [80, 20],
                            iconAnchor: [40, -5]
                        })
                    }).addTo(map);
                });
            });

        // Poyezd turiga qarab ikonkalar va ranglar
        function getTrainStyle(train) {
            if (train.is_emergency) return { icon: '🚨', color: 'bg-red-600' };
            if (train.type === 'afrosiyob') return { icon: '⚡', color: 'bg-green-600' };
            if (train.type === 'passenger') return { icon: '🚆', color: 'bg-blue-600' };
            return { icon: '📦', color: 'bg-amber-600' }; // cargo
        }

        const socket = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws');

        socket.onmessage = function(event) {
            const trains = JSON.parse(event.data);
            const trainList = document.getElementById('train-list');
            trainList.innerHTML = '';

            trains.forEach(train => {
                const style = getTrainStyle(train);

                if (!markers[train.id]) {
                    markers[train.id] = L.marker([train.lat, train.lng], {
                        icon: L.divIcon({
                            className: `rounded-full text-white text-xs ${style.color} border border-white flex items-center justify-center shadow-lg`,
                            html: style.icon,
                            iconSize: [24, 24]
                        })
                    }).bindPopup(`<b>${train.name}</b><br>Yo'nalish: ${train.route}<br>Tezlik: ${train.speed} km/s`).addTo(map);
                } else {
                    markers[train.id].setLatLng([train.lat, train.lng]);
                }

                trainList.innerHTML += `
                    <div class="p-3 bg-gray-900 rounded border border-gray-700 flex justify-between items-center">
                        <div>
                            <div class="text-xs font-bold text-white flex items-center gap-1">
                                <span>${style.icon}</span> ${train.name}
                            </div>
                            <div class="text-[10px] text-gray-400">${train.route}</div>
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded ${style.color} text-white">
                            ${train.speed} km/s
                        </span>
                    </div>
                `;
            });
        };
    </script>
</body>
</html>
