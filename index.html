<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'TY & FVV - Real-Time Poyezdlar Monitoringi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* FVV Favqulodda holat miltillash effekti */
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .emergency-marker {
            background-color: #ef4444;
            border-radius: 50%;
            border: 2px solid #ffffff;
            animation: pulse-red 1.2s infinite;
        }
        /* Stansiya nomlari yorlig'i */
        .station-label {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #3b82f6;
            color: #38bdf8;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🚂</span>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">O'zbekiston Temir Yo'llari & FVV Monitoring</h1>
                <p class="text-xs text-gray-400">Markaziy Dispatcherlik va Favqulodda Vaziyatlar Tizimi</p>
            </div>
        </div>
        <!-- Pointers Legenda -->
        <div class="hidden md:flex gap-4 text-xs bg-gray-900/60 px-3 py-1.5 rounded-lg border border-gray-700">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>⚡ Afrosiyob</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-blue-500 rounded-full"></span>🚆 Yo'lovchi</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-amber-500 rounded-full"></span>📦 Yuk Poyezdi</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>🚨 FVV Xavf</span>
        </div>
        <div id="status-badge" class="px-3 py-1 text-xs rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Tizim Faol
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Map -->
        <div class="flex-1 relative">
            <div id="map" class="w-full h-full bg-gray-950"></div>
        </div>

        <!-- Sidebar -->
        <div class="w-96 bg-gray-800 border-l border-gray-700 flex flex-col">
            <!-- FVV Alerts Panel -->
            <div class="p-4 border-b border-gray-700 bg-red-950/30">
                <h2 class="text-xs font-bold text-red-400 uppercase tracking-wider flex items-center gap-2 mb-2">
                    <span>🚨</span> FVV Favqulodda Bildirishnomalar
                </h2>
                <div id="emergency-list" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400 italic" id="no-emergency">Hozirda favqulodda holatlar yo'q</p>
                </div>
            </div>

            <!-- Active Trains List -->
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs font-bold text-gray-300 uppercase tracking-wider mb-3">Faol Poyezdlar Ro'yxati</h2>
                <div id="train-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- Audio for Emergency Alerts -->
    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([41.0000, 65.0000], 6);

        // API key talab qilmaydigan ochiq xarita
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const markers = {};
        let activeEmergencies = new Set();

        // Stansiya va liniyalarni yuklash
        fetch('/api/map-data')
            .then(res => res.json())
            .then(data => {
                // Temir yo'l chiziqlarini chizish (Uzun moviy uzuk-uzuk chiziqlar)
                Object.values(data.routes).forEach(route => {
                    L.polyline(route, { color: '#2563eb', weight: 4, opacity: 0.8, dashArray: '6, 6' }).addTo(map);
                });

                // Stansiyalarni ko'rsatish
                data.stations.forEach(st => {
                    L.circleMarker([st.lat, st.lng], { radius: 4, color: '#60a5fa', fillColor: '#0f172a', fillOpacity: 1 }).addTo(map);
                    L.marker([st.lat, st.lng], {
                        icon: L.divIcon({
                            className: 'station-label',
                            html: st.name,
                            iconAnchor: [35, -5]
                        })
                    }).addTo(map);
                });
            });

        function getTrainStyle(train) {
            if (train.is_emergency) return { icon: '🚨', bg: 'bg-red-600', text: 'text-red-400' };
            if (train.type === 'afrosiyob') return { icon: '⚡', bg: 'bg-emerald-600', text: 'text-emerald-400' };
            if (train.type === 'passenger') return { icon: '🚆', bg: 'bg-blue-600', text: 'text-blue-400' };
            return { icon: '📦', bg: 'bg-amber-600', text: 'text-amber-400' };
        }

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

        socket.onmessage = function(event) {
            const trains = JSON.parse(event.data);
            updateDashboard(trains);
        };

        function updateDashboard(trains) {
            const trainListEl = document.getElementById('train-list');
            const emergencyListEl = document.getElementById('emergency-list');
            trainListEl.innerHTML = '';

            trains.forEach(train => {
                const style = getTrainStyle(train);
                const isEmergency = train.is_emergency || train.speed === 0;

                // Markerlarni joylashtirish
                if (!markers[train.id]) {
                    const iconClass = isEmergency ? 'emergency-marker flex items-center justify-center text-white text-xs' : `rounded-full text-white text-xs ${style.bg} border border-white flex items-center justify-center shadow-lg`;
                    markers[train.id] = L.marker([train.lat, train.lng], {
                        icon: L.divIcon({
                            className: iconClass,
                            html: style.icon,
                            iconSize: [24, 24]
                        })
                    }).bindPopup(`<b>${train.name}</b><br>Yo'nalish: ${train.route}<br>Tezlik: ${train.speed} km/s`).addTo(map);
                } else {
                    markers[train.id].setLatLng([train.lat, train.lng]);
                }

                // O'ng tomondagi poyezdlar kartasi
                trainListEl.innerHTML += `
                    <div class="p-3 bg-gray-900 rounded-lg border ${isEmergency ? 'border-red-500/50' : 'border-gray-700'} flex justify-between items-center">
                        <div>
                            <div class="text-xs font-bold text-white flex items-center gap-1.5">
                                <span>${style.icon}</span> ${train.name}
                            </div>
                            <div class="text-[10px] text-gray-400 mt-0.5">${train.route}</div>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-1 rounded ${style.bg} text-white">
                            ${train.speed} km/s
                        </span>
                    </div>
                `;

                // FVV xabarnomasi
                if (isEmergency && !activeEmergencies.has(train.id)) {
                    activeEmergencies.add(train.id);
                    document.getElementById('alert-sound').play().catch(() => {});
                }
            });

            if (activeEmergencies.size > 0) {
                document.getElementById('no-emergency')?.remove();
                emergencyListEl.innerHTML = Array.from(activeEmergencies).map(id => `
                    <div class="p-2 bg-red-900/40 border border-red-500/50 rounded text-xs text-red-200">
                        <strong>⚠️ Xavf Sezildi!</strong> Poyezd ID: ${id} to'xtab qoldi yoki favqulodda signal berdi.
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
