<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'zbekiston Temir Yollari - FVV & TY Monitoring Markazi</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        #map { height: 100vh; width: 100%; }
        
        @keyframes blink-animation {
            0% { outline: 0px solid red; box-shadow: 0 0 0 0px rgba(255, 0, 0, 0.7); }
            50% { outline: 10px solid red; box-shadow: 0 0 0 25px rgba(255, 0, 0, 0); }
            100% { outline: 0px solid red; box-shadow: 0 0 0 0px rgba(255, 0, 0, 0); }
        }
        .emergency-marker {
            border-radius: 50%;
            animation: blink-animation 1s infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden">

    <div class="relative w-full h-screen">
        <div id="map"></div>

        <!-- Toast Notification (Xabarnoma Oynasi) -->
        <div id="toast-container" class="absolute top-4 left-1/2 -translate-x-1/2 z-[2000] hidden">
            <div class="bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-3 border-2 border-white/20 animate-bounce">
                <span class="text-2xl">🚨</span>
                <span id="toast-message">DIQQAT: Avariya Holati E'lon Qilindi!</span>
            </div>
        </div>

        <!-- Boshqaruv va Statistika Paneli -->
        <div class="absolute top-4 right-4 z-[1000] bg-slate-900/90 backdrop-blur-md p-5 rounded-xl border border-slate-700 shadow-2xl w-84">
            <h1 class="text-lg font-bold text-blue-400 mb-1 flex items-center gap-2">
                🏛️ FVV & TY MONITORING
            </h1>
            <p class="text-xs text-gray-400 mb-3">Respublika bo'yicha tezkor nazorat</p>

            <!-- Qidiruv Bo'limi -->
            <div class="mb-3">
                <input type="text" id="search-input" onkeyup="filterOrSearchTrain()" placeholder="🔍 Poyezd ID yoki nomini yozing..." 
                       class="w-full bg-slate-800 text-xs text-white border border-slate-600 rounded-lg p-2.5 focus:outline-none focus:border-blue-500">
            </div>

            <!-- Statistika -->
            <div class="grid grid-cols-3 gap-1.5 mb-3">
                <div class="bg-slate-800 p-2 rounded-lg text-center border border-slate-700">
                    <span class="text-[10px] text-gray-400">Jami</span>
                    <p id="total-trains" class="text-base font-bold text-white">0</p>
                </div>
                <div class="bg-slate-800 p-2 rounded-lg text-center border border-slate-700">
                    <span class="text-[10px] text-gray-400">O'rt. Tezlik</span>
                    <p id="avg-speed" class="text-base font-bold text-blue-400">0</p>
                </div>
                <div class="bg-slate-800 p-2 rounded-lg text-center border border-slate-700">
                    <span class="text-[10px] text-gray-400">Avariya</span>
                    <p id="emergency-count" class="text-base font-bold text-green-400">0</p>
                </div>
            </div>

            <!-- Filtrlash tugmalari -->
            <div class="mb-3">
                <p class="text-xs text-gray-300 font-semibold mb-2">Filtrlash:</p>
                <div class="grid grid-cols-2 gap-1.5 text-xs">
                    <button onclick="setFilter('all')" class="bg-slate-700 hover:bg-slate-600 py-1.5 px-2 rounded text-center transition">🌐 Barchasi</button>
                    <button onclick="setFilter('passenger')" class="bg-blue-600 hover:bg-blue-500 py-1.5 px-2 rounded text-center transition">🚆 Yo'lovchi</button>
                    <button onclick="setFilter('freight')" class="bg-amber-600 hover:bg-amber-500 py-1.5 px-2 rounded text-center transition">📦 Yuk / Neft</button>
                    <button onclick="setFilter('emergency')" class="bg-red-600 hover:bg-red-500 py-1.5 px-2 rounded text-center transition">🚨 Faqat Xavfli</button>
                </div>
            </div>

            <!-- ISTALGAN POYEZDDA AVARIYA SIMULYATSIYASI -->
            <div class="space-y-2 border-t border-slate-700 pt-3">
                <p class="text-xs text-gray-300 font-semibold mb-1">🚨 Favqulodda Holat Boshqaruvi:</p>
                
                <select id="train-select" class="w-full bg-slate-800 text-xs text-white border border-slate-600 rounded-lg p-2 focus:outline-none focus:border-red-500">
                    <option value="">-- Poyezdni tanlang --</option>
                </select>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="triggerSelectedEmergency()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-2 rounded-lg text-xs transition">
                        🚨 Avariya E'lon Qilish
                    </button>
                    <button onclick="resetSelectedEmergency()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-2 rounded-lg text-xs transition">
                        ✅ Xavfni Bekor Qilish
                    </button>
                </div>

                <button onclick="exportToCSV()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-2 mt-2">
                    📥 CSV Hisobotni Yuklab Olish
                </button>
            </div>
        </div>

        <!-- Hodisalar Jurnali -->
        <div class="absolute bottom-6 left-6 z-[1000] bg-slate-900/90 backdrop-blur-md p-4 rounded-xl border border-slate-700 shadow-2xl w-96 max-h-52 flex flex-col">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-xs font-bold text-gray-200 flex items-center gap-1.5">
                    📋 LIVE HODISALAR JURNALI
                </h3>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-blue-900/50 text-blue-300 border border-blue-700">Real-time</span>
            </div>
            <div id="incident-log" class="overflow-y-auto space-y-1.5 text-[11px] text-gray-300 pr-1 flex-1">
                <div class="text-gray-500 italic text-[10px]">Tizim ishga tushirildi. Kutilmoqda...</div>
            </div>
        </div>
    </div>

    <script>
        const map = L.map('map').setView([41.2995, 69.2401], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const railwayLines = [
            [[41.2995, 69.2401], [40.1250, 67.8800], [39.7747, 64.4286], [41.3800, 61.3600]],
            [[41.2995, 69.2401], [41.1100, 70.1500], [40.9200, 71.3200]],
            [[40.1250, 67.8800], [38.8605, 65.7890]]
        ];

        railwayLines.forEach(line => {
            L.polyline(line, { color: '#3b82f6', weight: 4, opacity: 0.6, dashArray: '8, 8' }).addTo(map);
        });

        const qamchiqZone = L.circle([41.1100, 70.1500], {
            color: 'red', fillColor: '#f03', fillOpacity: 0.25, radius: 35000
        }).addTo(map);
        qamchiqZone.bindPopup("<b>⚠️ XAVFLI ZONA: Qamchiq Dovoni</b>");

        const markers = {};
        let trainDataGlobal = [];
        let currentFilter = 'all';
        let previousEmergencyState = false;

        // Alarm Ovoz Fayli
        const audioAlert = new Audio('https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg');
        audioAlert.loop = true;

        // Brauzer Ovoz Blokirovkasini Yechish
        document.addEventListener('click', () => {
            audioAlert.play().then(() => {
                audioAlert.pause();
                audioAlert.currentTime = 0;
            }).catch(() => {});
        }, { once: true });

        function addLog(message, isDanger = false) {
            const logBox = document.getElementById('incident-log');
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `p-1.5 rounded border ${isDanger ? 'bg-red-950/60 border-red-800 text-red-300' : 'bg-slate-800/80 border-slate-700 text-gray-300'}`;
            logEntry.innerHTML = `<span class="text-gray-400 font-mono text-[10px]">[${time}]</span> ${message}`;
            logBox.prepend(logEntry);
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            if (trainDataGlobal.length > 0) renderTrains(trainDataGlobal);
        }

        function filterOrSearchTrain() {
            const query = document.getElementById('search-input').value.toLowerCase();
            if(!query) return;
            const foundTrain = trainDataGlobal.find(t => t.id.toLowerCase().includes(query) || t.name.toLowerCase().includes(query));
            if(foundTrain && markers[foundTrain.id]) {
                map.flyTo([foundTrain.lat, foundTrain.lng], 10, { duration: 1.5 });
                markers[foundTrain.id].openPopup();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-container');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 5000);
        }

        function updateTrainSelectOptions(trains) {
            const select = document.getElementById('train-select');
            const currentValue = select.value;
            select.innerHTML = '<option value="">-- Poyezdni tanlang --</option>';
            trains.forEach(train => {
                const option = document.createElement('option');
                option.value = train.id;
                option.textContent = `${train.id} - ${train.name}`;
                if (train.id === currentValue) option.selected = true;
                select.appendChild(option);
            });
        }

        async function triggerSelectedEmergency() {
            const trainId = document.getElementById('train-select').value;
            if (!trainId) return alert("Iltimos, avval poyezdni tanlang!");
            await fetch(`/trigger-emergency/${trainId}`, { method: 'POST' });
        }

        async function resetSelectedEmergency() {
            const trainId = document.getElementById('train-select').value;
            if (!trainId) return alert("Iltimos, avval poyezdni tanlang!");
            await fetch(`/reset-emergency/${trainId}`, { method: 'POST' });
        }

        let ws;
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

            ws.onmessage = (event) => {
                const trains = JSON.parse(event.data);
                trainDataGlobal = trains;
                renderTrains(trains);
            };

            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        function renderTrains(trains) {
            document.getElementById('total-trains').innerText = trains.length;
            updateTrainSelectOptions(trains);
            
            let emergencyNum = 0;
            let totalSpeed = 0;
            let hasActiveEmergency = false;

            trains.forEach(train => {
                totalSpeed += train.speed;
                const isEmergency = train.emergency;
                if (isEmergency) {
                    emergencyNum++;
                    hasActiveEmergency = true;
                }

                let shouldShow = true;
                if (currentFilter === 'passenger' && train.type !== 'passenger' && train.type !== 'high_speed') shouldShow = false;
                if (currentFilter === 'freight' && train.type !== 'freight') shouldShow = false;
                if (currentFilter === 'emergency' && !isEmergency) shouldShow = false;

                const markerColor = isEmergency ? '🔴' : (train.type === 'high_speed' ? '🔵' : '🟢');
                
                const customIcon = L.divIcon({
                    className: isEmergency ? 'emergency-marker' : '',
                    html: `<div style="font-size: 24px; text-shadow: 0 0 5px black;">${markerColor}</div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                if (markers[train.id]) {
                    if (shouldShow) {
                        markers[train.id].addTo(map);
                        markers[train.id].setLatLng([train.lat, train.lng]);
                        markers[train.id].setIcon(customIcon);
                    } else {
                        map.removeLayer(markers[train.id]);
                    }
                } else if (shouldShow) {
                    markers[train.id] = L.marker([train.lat, train.lng], { icon: customIcon }).addTo(map);
                }

                if (markers[train.id]) {
                    const popupContent = `
                        <div style="color: black; min-width: 190px;">
                            <h3 style="font-weight: bold; margin-bottom: 5px;">${train.name}</h3>
                            <b>ID:</b> ${train.id}<br>
                            <b>Yo'nalish:</b> ${train.route}<br>
                            <b>Tezlik:</b> ${train.speed} km/h<br>
                            <b>Holat:</b> ${train.status}<br>
                            <b>Mashinist:</b> ${train.driver}
                        </div>
                    `;
                    markers[train.id].bindPopup(popupContent);
                }
            });

            // OVOZ VA XABAR BERISH
            if (hasActiveEmergency && !previousEmergencyState) {
                audioAlert.play().catch(() => {});
                showToast(`🚨 FAVQULODDA VAZIYAT: Avariya aniqlandi!`);
                addLog(`🚨 FAVQULODDA VAZIYAT: Poyezd harakatida xavf aniqlandi!`, true);
                previousEmergencyState = true;
            } else if (!hasActiveEmergency && previousEmergencyState) {
                audioAlert.pause();
                audioAlert.currentTime = 0;
                addLog(`✅ Barcha xavflar bartaraf etildi.`);
                previousEmergencyState = false;
            }

            const avgSpeed = trains.length > 0 ? Math.round(totalSpeed / trains.length) : 0;
            document.getElementById('avg-speed').innerText = avgSpeed + " km/h";
            document.getElementById('emergency-count').innerText = emergencyNum;
        }

        connectWebSocket();

        function exportToCSV() {
            if(trainDataGlobal.length === 0) return alert("Ma'lumot topilmadi!");
            let csvContent = "data:text/csv;charset=utf-8,ID,Nomi,Yonalish,Tezlik(km/h),Avariya,Mashinist\n";
            trainDataGlobal.forEach(t => {
                csvContent += `${t.id},${t.name},${t.route},${t.speed},${t.emergency ? 'HA' : 'YOQ'},${t.driver}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `TY_Monitoring_Hisobot.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
