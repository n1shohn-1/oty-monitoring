<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yagona Monitoring Markazi - FVV & O'TY</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Avariya holati uchun qizil miltillash animatsiyasi */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            100% { transform: scale(1.5); opacity: 0; box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
        }
        
        .marker-emergency {
            background-color: #ef4444; /* Qizil */
            border: 3px solid white;
            border-radius: 50%;
            position: relative;
        }
        .marker-emergency::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 2px solid #ef4444;
            animation: pulse-ring 1.5s infinite ease-out;
        }

        .marker-passenger {
            background-color: #10b981; /* Yashil */
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .marker-freight {
            background-color: #3b82f6; /* Ko'k */
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        /* Skroll dizayni (chiroyliroq) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col lg:flex-row overflow-hidden selection:bg-blue-600 selection:text-white">

    <!-- CHAP TOMON: Boshqaruv Paneli (Sidebar) -->
    <aside class="w-full lg:w-[420px] bg-white border-r border-slate-200 shadow-xl flex flex-col h-full z-20">
        
        <!-- Yuqori sarlavha -->
        <div class="bg-slate-900 text-white p-5">
            <h1 class="text-xl font-bold uppercase tracking-wide leading-tight">Monitoring Markazi</h1>
            <p class="text-slate-400 text-sm mt-1">FVV va O'zbekiston Temir Yo'llari</p>
        </div>

        <!-- Panel ichidagi kontent (Skroll bo'ladi) -->
        <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-6">

            <!-- Statistika -->
            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase mb-3">Tizim Ko'rsatkichlari</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-100 p-4 rounded-lg border border-slate-200">
                        <span class="block text-sm text-slate-500 mb-1">Jami Obyektlar</span>
                        <span id="total-trains" class="text-3xl font-bold text-slate-800">0</span>
                    </div>
                    <div class="bg-red-50 p-4 rounded-lg border border-red-200">
                        <span class="block text-sm text-red-600 mb-1">Avariyalar</span>
                        <span id="emergency-count" class="text-3xl font-bold text-red-600">0</span>
                    </div>
                    <div class="bg-slate-100 p-4 rounded-lg border border-slate-200 col-span-2 flex justify-between items-center">
                        <span class="text-sm text-slate-500">O'rtacha Harakat Tezligi:</span>
                        <span id="avg-speed" class="text-2xl font-bold text-slate-800">0 km/h</span>
                    </div>
                </div>
            </div>

            <!-- Qidiruv va Filtrlash -->
            <div class="border-t border-slate-200 pt-5">
                <h2 class="text-xs font-bold text-slate-400 uppercase mb-3">Qidiruv va Filtrlash</h2>
                
                <input type="text" id="search-input" onkeyup="filterOrSearchTrain()" placeholder="Poyezd ID yoki nomini yozing..." 
                       class="w-full bg-white border border-slate-300 rounded-md px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 transition-all shadow-sm">

                <div class="grid grid-cols-2 gap-2 text-sm font-medium">
                    <button onclick="setFilter('all')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 py-2.5 rounded-md transition-colors">Barchasi</button>
                    <button onclick="setFilter('passenger')" class="bg-green-100 hover:bg-green-200 text-green-700 border border-green-200 py-2.5 rounded-md transition-colors">Yo'lovchi</button>
                    <button onclick="setFilter('freight')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 border border-blue-200 py-2.5 rounded-md transition-colors">Yuk / Neft</button>
                    <button onclick="setFilter('emergency')" class="bg-red-100 hover:bg-red-200 text-red-700 border border-red-200 py-2.5 rounded-md transition-colors">Favqulodda</button>
                </div>
            </div>

            <!-- Favqulodda Holat Boshqaruvi -->
            <div class="border-t border-slate-200 pt-5">
                <h2 class="text-xs font-bold text-red-600 uppercase mb-3 bg-red-100 inline-block px-2 py-1 rounded">Diqqat: Favqulodda Boshqaruv</h2>
                
                <select id="train-select" class="w-full bg-white border border-slate-300 rounded-md px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 mb-3 shadow-sm">
                    <option value="">-- Poyezdni tanlang --</option>
                </select>

                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button onclick="triggerSelectedEmergency()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-md shadow-md transition-colors text-sm">
                        Xavf E'lon Qilish
                    </button>
                    <button onclick="resetSelectedEmergency()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-md shadow-md transition-colors text-sm">
                        Holatni Normallashtirish
                    </button>
                </div>

                <button onclick="exportToCSV()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 rounded-md transition-colors text-sm shadow-md">
                    Hisobotni Yuklab Olish (CSV)
                </button>
            </div>

            <!-- Jurnal (Logs) -->
            <div class="border-t border-slate-200 pt-5 flex-1 flex flex-col min-h-[200px]">
                <h2 class="text-xs font-bold text-slate-400 uppercase mb-3">Tizim Jurnali (Oxirgi hodisalar)</h2>
                <div id="incident-log" class="bg-slate-100 border border-slate-200 rounded-md p-3 flex-1 overflow-y-auto space-y-2">
                    <!-- Xabarlar shu yerga tushadi -->
                </div>
            </div>

        </div>
    </aside>

    <!-- O'NG TOMON: Xarita -->
    <main class="flex-1 relative z-10 bg-slate-200">
        <!-- Toast Notification (Xabarnoma Oynasi - Katta va aniq) -->
        <div id="toast-container" class="absolute top-6 left-1/2 -translate-x-1/2 z-[2000] hidden w-11/12 max-w-2xl">
            <div class="bg-red-600 text-white px-6 py-4 rounded-lg shadow-2xl font-bold flex flex-col md:flex-row items-center justify-between border-4 border-white">
                <div class="flex items-center gap-4 mb-2 md:mb-0">
                    <span class="text-4xl bg-white text-red-600 rounded-full w-12 h-12 flex items-center justify-center">!</span>
                    <div>
                        <h3 class="text-xl uppercase tracking-wider">Tizimda Avariya</h3>
                        <p id="toast-message" class="text-sm font-medium text-red-100">Hududda favqulodda vaziyat qayd etildi!</p>
                    </div>
                </div>
                <button onclick="document.getElementById('toast-container').classList.add('hidden')" class="bg-white text-red-600 px-4 py-2 rounded text-sm hover:bg-red-50 transition">Tushundim</button>
            </div>
        </div>

        <div id="map" class="w-full h-full"></div>
    </main>

    <script>
        // Xarita sozlamalari (Ochiq va aniq ko'rinish)
        const map = L.map('map').setView([41.2995, 69.2401], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap | FVV Monitoring Markazi'
        }).addTo(map);

        // Temir yo'l chiziqlari (Ko'k rangda, oson ajralib turadi)
        const railwayLines = [
            [[41.2995, 69.2401], [40.1250, 67.8800], [39.7747, 64.4286], [41.3800, 61.3600]],
            [[41.2995, 69.2401], [41.1100, 70.1500], [40.9200, 71.3200]],
            [[40.1250, 67.8800], [38.8605, 65.7890]]
        ];

        railwayLines.forEach(line => {
            L.polyline(line, { color: '#1d4ed8', weight: 4, opacity: 0.7, dashArray: '10, 10' }).addTo(map);
        });

        // Xavfli zona - Qamchiq
        const qamchiqZone = L.circle([41.1100, 70.1500], {
            color: '#dc2626', fillColor: '#ef4444', fillOpacity: 0.2, radius: 35000
        }).addTo(map);
        qamchiqZone.bindPopup("<div class='p-2'><b class='text-red-600 text-sm block mb-1'>DIQQAT: Qamchiq Dovoni</b>Yuqori xavfli tog'li hudud.</div>");

        // Global o'zgaruvchilar
        const markers = {};
        let trainDataGlobal = [];
        let currentFilter = 'all';
        let previousEmergencyState = false;

        // Ovozli ogohlantirish
        const audioAlert = new Audio('https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg');
        audioAlert.loop = true;

        document.addEventListener('click', () => {
            audioAlert.play().then(() => {
                audioAlert.pause();
                audioAlert.currentTime = 0;
            }).catch(() => {});
        }, { once: true });

        // Tizim jurnali (Aniq va o'qishga oson)
        function addLog(message, isDanger = false) {
            const logBox = document.getElementById('incident-log');
            const time = new Date().toLocaleTimeString('uz-UZ', { hour12: false });
            const logEntry = document.createElement('div');
            
            if(isDanger) {
                logEntry.className = 'bg-red-50 border border-red-200 text-red-700 text-xs p-2 rounded';
                logEntry.innerHTML = `<b>[${time}] Avariya:</b> ${message}`;
            } else {
                logEntry.className = 'bg-white border border-slate-200 text-slate-600 text-xs p-2 rounded';
                logEntry.innerHTML = `<b class="text-slate-400">[${time}]</b> ${message}`;
            }
            
            logBox.prepend(logEntry);
        }

        addLog("Markaziy serverga ulanish muvaffaqiyatli amalga oshirildi.");

        // Filtrlash va qidiruv
        function setFilter(filterType) {
            currentFilter = filterType;
            if (trainDataGlobal.length > 0) renderTrains(trainDataGlobal);
        }

        function filterOrSearchTrain() {
            const query = document.getElementById('search-input').value.toLowerCase();
            if(!query) return;
            const foundTrain = trainDataGlobal.find(t => t.id.toLowerCase().includes(query) || t.name.toLowerCase().includes(query));
            if(foundTrain && markers[foundTrain.id]) {
                map.flyTo([foundTrain.lat, foundTrain.lng], 11, { duration: 1.5 });
                markers[foundTrain.id].openPopup();
            }
        }

        // Xabarnoma
        function showToast(msg) {
            const toast = document.getElementById('toast-container');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('hidden');
            // Qizil xabar 10 soniya turadi
            setTimeout(() => { toast.classList.add('hidden'); }, 10000);
        }

        function updateTrainSelectOptions(trains) {
            const select = document.getElementById('train-select');
            const currentValue = select.value;
            select.innerHTML = '<option value="">-- Poyezdni tanlang --</option>';
            trains.forEach(train => {
                const option = document.createElement('option');
                option.value = train.id;
                option.textContent = `${train.id} - ${train.name}`;
                if (train.id === currentValue) option.selected = true;
                select.appendChild(option);
            });
        }

        async function triggerSelectedEmergency() {
            const trainId = document.getElementById('train-select').value;
            if (!trainId) return alert("Avval ro'yxatdan poyezdni tanlang!");
            // Asl kodda API chaqiriladi
            try {
                await fetch(`/trigger-emergency/${trainId}`, { method: 'POST' });
                addLog(`${trainId} poyezdida xavf e'lon qilindi!`, true);
            } catch (e) {
                addLog(`Tarmoq xatosi yoki simulyatsiya rejimida (${trainId}).`, true);
            }
        }

        async function resetSelectedEmergency() {
            const trainId = document.getElementById('train-select').value;
            if (!trainId) return alert("Avval ro'yxatdan poyezdni tanlang!");
            try {
                await fetch(`/reset-emergency/${trainId}`, { method: 'POST' });
                addLog(`${trainId} poyezdi holati normallashdi.`);
            } catch (e) {
                addLog(`Simulyatsiya rejimi: ${trainId} normallashdi.`);
            }
        }

        // WebSocket ulanishi (Dasturni ishlashini ko'rish uchun Mock Data qoldirildi)
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

            ws.onmessage = (event) => {
                const trains = JSON.parse(event.data);
                trainDataGlobal = trains;
                renderTrains(trains);
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000);
            };
        }

        function renderTrains(trains) {
            document.getElementById('total-trains').innerText = trains.length;
            updateTrainSelectOptions(trains);
            
            let emergencyNum = 0;
            let totalSpeed = 0;
            let hasActiveEmergency = false;

            trains.forEach(train => {
                totalSpeed += train.speed;
                const isEmergency = train.emergency;
                if (isEmergency) {
                    emergencyNum++;
                    hasActiveEmergency = true;
                }

                // Filtrlash mantiqi
                let shouldShow = true;
                if (currentFilter === 'passenger' && train.type !== 'passenger' && train.type !== 'high_speed') shouldShow = false;
                if (currentFilter === 'freight' && train.type !== 'freight') shouldShow = false;
                if (currentFilter === 'emergency' && !isEmergency) shouldShow = false;

                // Aniq va yirik markerlar dizayni
                let markerClass = 'marker-freight'; // ko'k
                if(isEmergency) markerClass = 'marker-emergency'; // qizil
                else if(train.type === 'passenger' || train.type === 'high_speed') markerClass = 'marker-passenger'; // yashil

                const customIcon = L.divIcon({
                    className: '',
                    html: `<div class="${markerClass}" style="width: 22px; height: 22px;"></div>`,
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                });

                if (markers[train.id]) {
                    if (shouldShow) {
                        markers[train.id].addTo(map);
                        markers[train.id].setLatLng([train.lat, train.lng]);
                        markers[train.id].setIcon(customIcon);
                    } else {
                        map.removeLayer(markers[train.id]);
                    }
                } else if (shouldShow) {
                    markers[train.id] = L.marker([train.lat, train.lng], { icon: customIcon }).addTo(map);
                }

                // Pop-up oyna (Oq fonda, toza, aniq yozuvlar)
                if (markers[train.id]) {
                    const popupContent = `
                        <div style="font-family: Arial, sans-serif; min-width: 200px; padding: 5px;">
                            <h3 style="margin: 0 0 10px 0; font-size: 16px; font-weight: bold; color: #1e293b; border-bottom: 2px solid ${isEmergency ? '#ef4444' : '#e2e8f0'}; padding-bottom: 5px;">
                                ${train.name}
                            </h3>
                            <div style="font-size: 13px; line-height: 1.6; color: #475569;">
                                <b>Poyezd ID:</b> <span style="color: #0f172a;">${train.id}</span><br>
                                <b>Yo'nalish:</b> <span style="color: #0f172a;">${train.route}</span><br>
                                <b>Tezlik:</b> <span style="color: #0f172a;">${train.speed} km/h</span><br>
                                <b>Holat:</b> <span style="font-weight: bold; color: ${isEmergency ? '#ef4444' : '#10b981'};">${isEmergency ? 'AVARIYA HOLATI' : train.status}</span><br>
                                <b>Mashinist:</b> <span style="color: #0f172a;">${train.driver}</span>
                            </div>
                        </div>
                    `;
                    markers[train.id].bindPopup(popupContent);
                }
            });

            // Ovoz va xabarlar avtomatikasi
            if (hasActiveEmergency && !previousEmergencyState) {
                audioAlert.play().catch(() => {});
                showToast(`Tizimdagi ba'zi poyezdlarda favqulodda xavf qayd etildi! Operator zudlik bilan chora ko'rishi talab etiladi.`);
                addLog(`Tizim ogohlantirishi: Obyektlarda favqulodda vaziyat!`, true);
                previousEmergencyState = true;
            } else if (!hasActiveEmergency && previousEmergencyState) {
                audioAlert.pause();
                audioAlert.currentTime = 0;
                document.getElementById('toast-container').classList.add('hidden');
                addLog(`Barcha xavflar bartaraf etildi. Holat normal.`);
                previousEmergencyState = false;
            }

            const avgSpeed = trains.length > 0 ? Math.round(totalSpeed / trains.length) : 0;
            document.getElementById('avg-speed').innerText = avgSpeed + " km/h";
            document.getElementById('emergency-count').innerText = emergencyNum;
        }

        connectWebSocket();

        // Hisobotni yuklash
        function exportToCSV() {
            if(trainDataGlobal.length === 0) return alert("Ma'lumotlar mavjud emas!");
            let csvContent = "data:text/csv;charset=utf-8,ID,Poyezd_Nomi,Turi,Yonalish,Tezlik(km/h),Holat,Mashinist,Kenglik,Uzunlik\n";
            trainDataGlobal.forEach(t => {
                csvContent += `${t.id},${t.name},${t.type},${t.route},${t.speed},${t.emergency ? 'AVARIYA' : 'NORMAL'},${t.driver},${t.lat},${t.lng}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Monitoring_Hisobot_${new Date().toLocaleDateString('uz-UZ')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            addLog("Hisobot yuklab olindi.");
        }
    </script>
</body>
</html>
