<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'TY & FVV - Markaziy Temir Yo'l Monitoring Ekrani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @keyframes emergency-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70% { transform: scale(1.3); box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .marker-emergency {
            background-color: #ef4444;
            border-radius: 50%;
            border: 2px solid #ffffff;
            animation: emergency-pulse 1s infinite;
        }
        .marker-moving { background-color: #10b981; border-radius: 50%; border: 2px solid #ffffff; }
        .marker-stopped { background-color: #f59e0b; border-radius: 50%; border: 2px solid #ffffff; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col h-screen overflow-hidden font-sans">

    <!-- Top Header / Status Bar -->
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🛰️</span>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">O'zbekiston Temir Yo'llari GPS Telemetriya & FVV Tizimi</h1>
                <p class="text-xs text-gray-400">Respublika bo'ylab poyezdlar harakati va favqulodda holatlar tezkor ekrani</p>
            </div>
        </div>
        <div class="flex items-center gap-6 text-xs">
            <div class="flex items-center gap-2"><span class="w-3 h-3 bg-emerald-500 rounded-full"></span> Harakatda</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 bg-amber-500 rounded-full"></span> Harakatsiz (To'xtagan)</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span> FVV Favqulodda Xavf</div>
        </div>
    </header>

    <!-- Main View -->
    <div class="flex flex-1 relative overflow-hidden">
        <!-- Katta Xarita -->
        <div id="map" class="flex-1 w-full h-full bg-gray-900"></div>

        <!-- O'ng tomondagi FVV va Poyezdlar Holati Paneli -->
        <div class="w-96 bg-gray-900/90 backdrop-blur border-l border-gray-800 flex flex-col z-[1000]">
            <!-- FVV Xavf Bildirishnomasi -->
            <div class="p-4 border-b border-gray-800 bg-red-950/40">
                <h2 class="text-xs font-bold text-red-400 uppercase tracking-wider flex items-center gap-2 mb-2">
                    <span>🚨</span> FVV TEZKOR OGOHLANTIRISH
                </h2>
                <div id="fvv-alert-box" class="space-y-2 max-h-48 overflow-y-auto">
                    <p class="text-xs text-gray-500 italic" id="no-fvv">Hozirda xavf signallari kelmadi</p>
                </div>
            </div>

            <!-- Poyezdlar Ro'yxati va GPS Holati -->
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Poyezdlar Telemetriyasi</h2>
                <div id="train-telemetry-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([41.0000, 65.0000], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const markers = {};
        let activeAlerts = new Set();

        // Temir yo'l magistrallari chizig'ini xaritaga chiqarish
        fetch('/api/routes')
            .then(res => res.json())
            .then(routes => {
                Object.values(routes).forEach(routeCoords => {
                    L.polyline(routeCoords, { color: '#3b82f6', weight: 4, opacity: 0.7, dashArray: '8, 8' }).addTo(map);
                });
            });

        const socket = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws');

        socket.onmessage = function(event) {
            const trains = JSON.parse(event.data);
            const telemetryList = document.getElementById('train-telemetry-list');
            const fvvBox = document.getElementById('fvv-alert-box');

            telemetryList.innerHTML = '';

            trains.forEach(train => {
                let markerClass = 'marker-moving';
                let statusBadge = '<span class="text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2 py-0.5 rounded text-[10px]">Harakatda</span>';

                if (train.is_emergency) {
                    markerClass = 'marker-emergency';
                    statusBadge = '<span class="text-red-400 bg-red-950/60 border border-red-800 px-2 py-0.5 rounded text-[10px] animate-pulse">FVV XAVF</span>';
                } else if (train.status === 'stopped' || train.speed === 0) {
                    markerClass = 'marker-stopped';
                    statusBadge = '<span class="text-amber-400 bg-amber-950/60 border border-amber-800 px-2 py-0.5 rounded text-[10px]">Harakatsiz</span>';
                }

                // GPS Markerni yangilash
                if (!markers[train.id]) {
                    markers[train.id] = L.marker([train.lat, train.lng], {
                        icon: L.divIcon({ className: `${markerClass} w-5 h-5`, iconSize: [20, 20] })
                    }).bindPopup(`
                        <b>${train.name}</b><br>
                        <b>Marshrut:</b> ${train.route}<br>
                        <b>GPS Tezlik:</b> ${train.speed} km/s<br>
                        <b>Status:</b> ${train.status}
                    `).addTo(map);
                } else {
                    markers[train.id].setLatLng([train.lat, train.lng]);
                }

                // O'ng paneldagi telemetriya ma'lumoti
                telemetryList.innerHTML += `
                    <div class="p-3 bg-gray-950/80 rounded-lg border border-gray-800 flex justify-between items-center">
                        <div>
                            <div class="text-xs font-bold text-white">${train.name}</div>
                            <div class="text-[10px] text-gray-400">${train.route}</div>
                            <div class="text-[10px] text-gray-500 mt-1">GPS: ${train.lat.toFixed(3)}, ${train.lng.toFixed(3)}</div>
                        </div>
                        <div class="text-right flex flex-col items-end gap-1">
                            ${statusBadge}
                            <span class="text-[11px] font-mono text-gray-300">${train.speed} km/s</span>
                        </div>
                    </div>
                `;

                // FVV Signalini tutib olish
                if (train.is_emergency && !activeAlerts.has(train.id)) {
                    activeAlerts.add(train.id);
                    document.getElementById('alert-sound').play().catch(() => {});
                }
            });

            if (activeAlerts.size > 0) {
                document.getElementById('no-fvv')?.remove();
                fvvBox.innerHTML = Array.from(activeAlerts).map(id => `
                    <div class="p-2.5 bg-red-900/40 border border-red-500/60 rounded text-xs text-red-200">
                        <strong>⚠️ FAVQULODDA VAZIYAT!</strong><br>
                        Poyezd ID: <b>${id}</b> GPS signali bo'yicha to'xtab qoldi yoki halokat xavfi bor!
                    </div>
                `).join('');
            }
        };
    </script>
</body>
</html>
