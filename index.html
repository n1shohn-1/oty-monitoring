<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'TY & FVV - Real-Time Poyezdlar Monitoringi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* FVV Favqulodda holat miltillash effekti */
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .emergency-marker {
            background-color: #ef4444;
            border-radius: 50%;
            border: 2px solid #ffffff;
            animation: pulse-red 1.2s infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🚂</span>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">O'zbekiston Temir Yo'llari & FVV Monitoring</h1>
                <p class="text-xs text-gray-400">Real-vaqt rejimida poyezdlar harakati va tezkor ogohlantirish tizimi</p>
            </div>
        </div>
        <div id="status-badge" class="px-3 py-1 text-xs rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            Tizim faol
        </div>
    </header>

    <!-- Main Dashboard -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Map Container -->
        <div class="flex-1 relative">
            <div id="map" class="w-full h-full bg-gray-950"></div>
        </div>

        <!-- Sidebar (Emergency Alerts & Train List) -->
        <div class="w-96 bg-gray-800 border-l border-gray-700 flex flex-col">
            <!-- Emergency Alerts Panel -->
            <div class="p-4 border-b border-gray-700 bg-red-950/30">
                <h2 class="text-sm font-bold text-red-400 uppercase tracking-wider flex items-center gap-2 mb-2">
                    <span>🚨</span> FVV Favqulodda Bildirishnomalar
                </h2>
                <div id="emergency-list" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400 italic" id="no-emergency">Hozirda favqulodda holatlar yo'q</p>
                </div>
            </div>

            <!-- Active Trains List -->
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-sm font-bold text-gray-300 uppercase tracking-wider mb-3">Faol Poyezdlar Ro'yxati</h2>
                <div id="train-list" class="space-y-3">
                    <!-- Dynamic train items go here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Audio for Emergency Alerts -->
    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Xaritani sozlash (Dark Mode style tiles)
        const map = L.map('map').setView([41.2995, 69.2401], 6); // O'zbekiston markazi
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap & CartoDB'
        }).addTo(map);

        const markers = {};
        const polylines = {};
        let activeEmergencies = new Set();

        // WebSocket ulanishini o'rnatish
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        const socket = new WebSocket(wsUrl);

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            updateDashboard(data);
        };

        function updateDashboard(trains) {
            const trainListEl = document.getElementById('train-list');
            const emergencyListEl = document.getElementById('emergency-list');
            
            let hasNewEmergency = false;

            trains.forEach(train => {
                const isEmergency = train.is_emergency || train.speed === 0;

                // 1. Marker yaratish yoki yangilash
                if (!markers[train.id]) {
                    const iconClass = isEmergency ? 'emergency-marker' : 'bg-blue-500 border-2 border-white rounded-full';
                    const markerIcon = L.divIcon({
                        className: iconClass,
                        iconSize: [20, 20]
                    });

                    markers[train.id] = L.marker([train.lat, train.lng], { icon: markerIcon })
                        .bindPopup(`<b>${train.name}</b><br>Tezlik: ${train.speed} km/s<br>Yo'nalish: ${train.route}`)
                        .addTo(map);

                    // Yo'nalish chizig'i (Polyline)
                    polylines[train.id] = L.polyline([[train.lat, train.lng]], { color: isEmergency ? '#ef4444' : '#3b82f6', weight: 3 }).addTo(map);
                } else {
                    markers[train.id].setLatLng([train.lat, train.lng]);
                    polylines[train.id].addLatLng([train.lat, train.lng]);
                }

                // 2. Favqulodda holatni qayta ishlash
                if (isEmergency && !activeEmergencies.has(train.id)) {
                    activeEmergencies.add(train.id);
                    hasNewEmergency = true;
                    
                    // Ovozli signal chalish
                    document.getElementById('alert-sound').play().catch(() => {});
                }
            });

            // FVV xabarnomalar paneli yangilanishi
            if (activeEmergencies.size > 0) {
                document.getElementById('no-emergency')?.remove();
                emergencyListEl.innerHTML = Array.from(activeEmergencies).map(id => `
                    <div class="p-2 bg-red-900/50 border border-red-500/50 rounded text-xs text-red-200">
                        <strong>⚠️ Xavf Sezildi!</strong> Poyezd ID: ${id} to'xtab qoldi yoki favqulodda signal berdi.
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
